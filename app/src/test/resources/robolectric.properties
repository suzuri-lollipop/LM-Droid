# Unit tests need only a plain Context (e.g. to build an in-memory Room database) — they must
# not boot the real LmDroidApplication, whose onCreate() eagerly builds AppContainer and, with
# it, ApiKeyCipher's "AndroidKeyStore" KeyStore, which doesn't exist under Robolectric's JVM and
# crashes every test's app-startup step before the test itself even runs.
application=android.app.Application
